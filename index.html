<title>ツアー立替精算</title>
<style>
:root {
  --sage: #5a7a5a;
  --sage-light: #7a9a7a;
  --sage-pale: #e8f0e8;
  --terra: #8b5e3c;
  --stone: #6b6b6b;
  --bg: #f5f3ef;
  --card: #ffffff;
  --border: #d8d0c8;
  --text: #2c2c2c;
  --text-soft: #6b6b6b;
  --danger: #c0392b;
  --fee-color: #7a5c2e;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Hiragino Kaku Gothic Pro', 'Noto Sans JP', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh; }

/* ===== HEADER ===== */
.header { background: var(--sage); color: #fff; padding: 14px 16px;
  display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
.header-logo { width: 72px; height: 36px; border-radius: 6px; object-fit: contain; background: #fff; }
.header-title { font-size: 1.05rem; font-weight: 700; flex: 1; }
.header-sub { font-size: 0.72rem; opacity: 0.85; }
.header-btn { background: rgba(255,255,255,0.2); border: none; color: #fff;
  border-radius: 8px; padding: 6px 12px; font-size: 0.78rem; cursor: pointer;
  white-space: nowrap; }
.header-btn:hover { background: rgba(255,255,255,0.3); }

/* ===== VIEW MODE BANNER ===== */
#view-banner { display: none; background: #2e7d32; color: #fff;
  text-align: center; padding: 8px 16px; font-size: 0.82rem; font-weight: 600; }
#view-timestamp { font-size: 0.72rem; opacity: 0.9; margin-top: 2px; }

/* ===== TABS ===== */
.tab-bar { display: flex; background: var(--card); border-bottom: 1px solid var(--border);
  position: sticky; top: 64px; z-index: 90; }
.tab-btn { flex: 1; padding: 12px 4px; border: none; background: none;
  font-size: 0.75rem; color: var(--text-soft); cursor: pointer; border-bottom: 2px solid transparent;
  transition: all 0.2s; font-family: inherit; }
.tab-btn.active { color: var(--sage); border-bottom-color: var(--sage); font-weight: 700; }

/* ===== CONTENT ===== */
.tab-content { display: none; padding: 16px; max-width: 600px; margin: 0 auto; }
.tab-content.active { display: block; }

/* ===== CARD ===== */
.card { background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
.card-title { font-size: 0.82rem; font-weight: 700; color: var(--stone);
  text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }

/* ===== FORM ===== */
.form-group { margin-bottom: 12px; }
label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--stone);
  margin-bottom: 4px; }
input, select, textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
  border-radius: 8px; font-size: 0.9rem; font-family: inherit; background: var(--bg);
  color: var(--text); transition: border-color 0.2s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--sage); }
textarea { resize: vertical; min-height: 60px; }

/* ===== BUTTONS ===== */
.btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 0.88rem;
  font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.btn-primary { background: var(--sage); color: #fff; }
.btn-primary:hover { background: var(--sage-light); }
.btn-secondary { background: var(--bg); color: var(--text); border: 1.5px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-full { width: 100%; margin-top: 8px; }
.btn-sm { padding: 5px 10px; font-size: 0.75rem; }

/* ===== MEMBER CARDS ===== */
.member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.member-card { background: var(--sage-pale); border-radius: 10px; padding: 10px;
  text-align: center; position: relative; }
.member-card-name { font-size: 0.85rem; font-weight: 700; }
.member-card-role { font-size: 0.68rem; color: var(--stone); margin-top: 2px; }
.member-card-remove { position: absolute; top: 4px; right: 6px; background: none;
  border: none; color: var(--stone); cursor: pointer; font-size: 0.8rem; padding: 2px; }
.member-card-tc { background: #fff3e0; }

/* ===== CHECKBOXES ===== */
.check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; }
.check-item { display: flex; align-items: center; gap: 6px; padding: 6px 10px;
  background: var(--bg); border-radius: 8px; cursor: pointer; border: 1.5px solid var(--border);
  font-size: 0.82rem; transition: all 0.15s; }
.check-item.checked { background: var(--sage-pale); border-color: var(--sage); }
.check-item input[type=checkbox] { width: auto; accent-color: var(--sage); }

/* ===== EXPENSE LIST ===== */
.expense-item { display: flex; align-items: center; gap: 8px; padding: 10px 0;
  border-bottom: 1px solid var(--border); }
.expense-item:last-child { border-bottom: none; }
.expense-info { flex: 1; min-width: 0; }
.expense-name { font-size: 0.88rem; font-weight: 600; }
.expense-meta { font-size: 0.72rem; color: var(--text-soft); margin-top: 2px; }
.expense-amount { font-size: 0.95rem; font-weight: 700; color: var(--sage); white-space: nowrap; }
.expense-actions { display: flex; gap: 4px; }
.icon-btn { background: none; border: none; cursor: pointer; padding: 4px 6px;
  border-radius: 6px; font-size: 0.85rem; color: var(--stone); }
.icon-btn:hover { background: var(--bg); }

/* ===== SETTLEMENT ===== */
.settlement-card { background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
.settlement-card-header { display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; background: var(--sage-pale); }
.settlement-card-name { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.95rem; }
.settlement-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--sage);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 0.78rem; font-weight: 700; flex-shrink: 0; }
.settlement-card-total { font-size: 1.1rem; font-weight: 700; color: var(--sage); }
.settlement-card-body { padding: 12px 16px; }
.settlement-line { display: flex; justify-content: space-between; align-items: center;
  padding: 4px 0; font-size: 0.85rem; }
.settlement-line .amt { font-weight: 600; }
.settlement-line.breakdown-item { color: var(--text-soft); padding: 2px 0 2px 16px; font-size: 0.78rem; }
.settlement-line.fee { color: var(--fee-color); margin-top: 4px; }
.settlement-line.total { border-top: 1.5px solid var(--border); margin-top: 6px;
  padding-top: 8px; font-weight: 700; color: var(--sage); }

/* ===== SETTLEMENT SUMMARY ===== */
.summary-box { background: var(--sage); color: #fff; border-radius: var(--radius);
  padding: 16px; margin-bottom: 16px; }
.summary-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; }
.summary-row.total { font-size: 1rem; font-weight: 700; border-top: 1px solid rgba(255,255,255,0.3);
  margin-top: 8px; padding-top: 8px; }

/* ===== MID-TOUR WARNING ===== */
.mid-tour-note { background: #fff8e1; border: 1.5px solid #ffc107; border-radius: 8px;
  padding: 10px 12px; font-size: 0.78rem; color: #795548; margin-top: 8px; }
.mid-tour-note strong { color: #5d4037; }

/* ===== MODAL ===== */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 200; align-items: flex-end; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--card); border-radius: 20px 20px 0 0; padding: 24px 20px 32px;
  width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 1rem; font-weight: 700; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-actions .btn { flex: 1; }

/* ===== TOAST ===== */
#toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #333; color: #fff; padding: 10px 20px; border-radius: 20px;
  font-size: 0.85rem; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 500;
  white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== SETUP ===== */
#setup-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px; background: var(--bg); }
.setup-card { background: var(--card); border-radius: 20px; padding: 28px 24px;
  width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
.setup-logo { text-align: center; margin-bottom: 20px; }
.setup-logo-img { width: 160px; height: 80px; border-radius: 12px; object-fit: contain; background: #fff; cursor: pointer; }
.setup-title { font-size: 1.3rem; font-weight: 700; color: var(--sage); margin-bottom: 4px; }
.setup-sub { font-size: 0.82rem; color: var(--text-soft); margin-bottom: 20px; }
#app { display: none; }

/* ===== SAVE INDICATOR ===== */
.save-indicator { text-align: center; font-size: 0.7rem; color: var(--text-soft); padding: 8px; }

/* ===== CSV BUTTONS ===== */
.csv-row { display: flex; gap: 8px; margin-top: 8px; }
.csv-row .btn { flex: 1; font-size: 0.78rem; padding: 8px 10px; }

/* ===== SHARE MODAL ===== */
#share-url-box { width: 100%; padding: 10px; background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 8px; font-size: 0.72rem; word-break: break-all; color: var(--text-soft);
  min-height: 60px; margin: 8px 0; }

/* ===== EMPTY STATE ===== */
.empty-state { text-align: center; padding: 32px 16px; color: var(--text-soft); font-size: 0.85rem; }
</style>
</head>

var isViewMode = false;
var currentTab = 'members';
var shareURL = '';

// ===== STORAGE =====
function saveState() {
  try {
    localStorage.setItem('tour_split_v3', JSON.stringify(state));
    var now = new Date();
    document.getElementById('save-indicator').textContent =
      '💾 ' + now.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}) + ' 保存済み';
  } catch(e) {}
}
function loadState() {
  try {
    var raw = localStorage.getItem('tour_split_v3');
    if (!raw) return false;
    state = JSON.parse(raw);
    return true;
  } catch(e) { return false; }
}

// ===== FORMAT (Bug fix #2: round only at display) =====
function fmt(n) {
  return state.currency + Math.round(n).toLocaleString('ja-JP');
}
function vfmt(n, currency) {
  return currency + Math.round(n).toLocaleString('ja-JP');
}

// ===== LOGO UPLOAD =====
function handleLogoUpload(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    state.logoData = ev.target.result;
    document.getElementById('setup-logo-img').src = state.logoData;
  };
  reader.readAsDataURL(file);
}

// ===== SETUP =====
function startTour() {
  var name = document.getElementById('s-tour').value.trim();
  var guide = document.getElementById('s-guide').value.trim();
  if (!name || !guide) { alert('ツアー名と案内人名を入力してください'); return; }
  state.tourName = name;
  state.guide = guide;
  state.currency = document.getElementById('s-currency').value || '¥';
  if (!state.logoData) {
    state.logoData = document.getElementById('setup-logo-img').src;
  }
  saveState();
  launchApp();
}

function launchApp() {
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('header-title').textContent = state.tourName;
  document.getElementById('header-sub').textContent = '案内人：' + state.guide;
  document.getElementById('header-logo').src = state.logoData || '';
  renderMemberCards();
  renderParticipantChecks();
  renderRecentExpenses();
  renderSettlement();
  renderHistory();
  if (state.participants.length > 0) {
    document.getElementById('mid-tour-warning').style.display = 'block';
  }
}

function confirmNewTour() {
  if (!confirm('新しいツアーを開始します。現在のデータはすべて削除されます。よろしいですか？')) return;
  localStorage.removeItem('tour_split_v3');
  state = { tourName: '', guide: '', currency: '¥', logoData: null, participants: [], expenses: [] };
  document.getElementById('app').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'flex';
  document.getElementById('s-tour').value = '';
  document.getElementById('s-guide').value = '';
}

// ===== TABS =====
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab-btn').forEach(function(b, i) {
    var tabs = ['members','expenses','settlement','history'];
    b.classList.toggle('active', tabs[i] === name);
  });
  document.querySelectorAll('.tab-content').forEach(function(c) {
    c.classList.toggle('active', c.id === 'tab-' + name);
  });
  if (name === 'settlement') renderSettlement();
  if (name === 'history') renderHistory();
}

// ===== MEMBERS =====
function renderMemberCards() {
  // TC card
  document.getElementById('tc-card-area').innerHTML =
    '<div class="member-card member-card-tc">' +
    '<div class="member-card-name">' + esc(state.guide) + '</div>' +
    '<div class="member-card-role">TC・案内人</div></div>';

  // Participant cards
  document.getElementById('member-cards').innerHTML = state.participants.length === 0
    ? '<div style="color:var(--text-soft);font-size:0.82rem;padding:8px 0;">まだ参加者がいません</div>'
    : state.participants.map(function(p, i) {
        return '<div class="member-card">' +
          (isViewMode ? '' : '<button class="member-card-remove" onclick="removeMember(' + i + ')">✕</button>') +
          '<div class="member-card-name">' + esc(p) + '</div>' +
          '<div class="member-card-role">参加者</div></div>';
      }).join('');

  // Show mid-tour warning if participants already exist
  if (state.participants.length > 0 && !isViewMode) {
    document.getElementById('mid-tour-warning').style.display = 'block';
  }
}

function removeMember(i) {
  if (!confirm(state.participants[i] + ' を削除しますか？')) return;
  state.participants.splice(i, 1);
  saveState();
  renderMemberCards();
  renderParticipantChecks();
  updateSummaryLabel();
}

function addMemberMidTour() {
  var input = document.getElementById('new-member-input');
  var name = input.value.trim();
  if (!name) { alert('参加者名を入力してください'); return; }
  if (name === state.guide) { alert('案内人と同じ名前は登録できません'); return; }
  if (state.participants.includes(name)) { alert('同じ名前の参加者が既に登録されています'); return; }
  state.participants.push(name);
  input.value = '';
  saveState();
  renderMemberCards();
  renderParticipantChecks();
  updateSummaryLabel();
  showToast('✔ ' + name + ' を追加しました');
}

// ===== PARTICIPANT CHECKS (for expense form) =====
function renderParticipantChecks() {
  var el = document.getElementById('participant-checks');
  if (state.participants.length === 0) {
    el.innerHTML = '<div style="color:var(--text-soft);font-size:0.78rem;">メンバータブで参加者を追加してください</div>';
    return;
  }
  el.innerHTML = state.participants.map(function(p) {
    return '<label class="check-item checked" id="chk-wrap-' + esc(p) + '">' +
      '<input type="checkbox" checked onchange="toggleCheck(this)">' +
      '<span>' + esc(p) + '</span></label>';
  }).join('');
}

function toggleCheck(cb) {
  cb.closest('.check-item').classList.toggle('checked', cb.checked);
}

function toggleAllTargets() {
  var items = document.querySelectorAll('#participant-checks .check-item');
  var anyChecked = Array.from(items).some(function(it) {
    return it.querySelector('input').checked;
  });
  items.forEach(function(it) {
    var cb = it.querySelector('input');
    cb.checked = !anyChecked;
    it.classList.toggle('checked', cb.checked);
  });
}

function getCheckedTargets() {
  return Array.from(document.querySelectorAll('#participant-checks .check-item.checked span'))
    .map(function(s) { return s.textContent; });
}

function updateSummaryLabel() {
  // update any open add-form labels
}

// ===== ADD EXPENSE =====
function addExpense() {
  var name = document.getElementById('e-name').value.trim();
  var amount = parseFloat(document.getElementById('e-amount').value);
  var targets = getCheckedTargets();
  if (!name) { alert('内容を入力してください'); return; }
  if (!amount || amount <= 0) { alert('正しい金額を入力してください'); return; }
  if (targets.length === 0) { alert('対象者を1人以上選択してください'); return; }

  var today = new Date();
  var dateStr = today.getFullYear() + '-' +
    String(today.getMonth()+1).padStart(2,'0') + '-' +
    String(today.getDate()).padStart(2,'0');

  state.expenses.push({
    id: Date.now().toString(),
    date: dateStr,
    name: name,
    cat: document.getElementById('e-cat').value,
    amount: amount,
    targets: targets,
    memo: document.getElementById('e-memo').value.trim()
  });

  document.getElementById('e-name').value = '';
  document.getElementById('e-amount').value = '';
  document.getElementById('e-memo').value = '';
  saveState();
  renderRecentExpenses();
  showToast('✔ ' + name + ' を追加しました');
}

// ===== RECENT EXPENSES =====
function renderRecentExpenses() {
  var el = document.getElementById('recent-expenses');
  var recent = state.expenses.slice(-5).reverse();
  if (recent.length === 0) {
    el.innerHTML = '<div class="empty-state">まだ立替がありません</div>';
    return;
  }
  el.innerHTML = recent.map(function(e) {
    var perPerson = e.amount / e.targets.length; // keep float
    return '<div class="expense-item">' +
      '<div class="expense-info">' +
        '<div class="expense-name">' + esc(e.name) + '</div>' +
        '<div class="expense-meta">' + e.cat + ' · ' + e.targets.length + '人 · 1人' + fmt(perPerson) + '</div>' +
      '</div>' +
      '<div class="expense-amount">' + fmt(e.amount) + '</div>' +
      (!isViewMode ? '<div class="expense-actions">' +
        '<button class="icon-btn" onclick="openEdit(\'' + e.id + '\')">✏️</button>' +
        '<button class="icon-btn" onclick="deleteExpense(\'' + e.id + '\')">🗑️</button>' +
      '</div>' : '') +
    '</div>';
  }).join('');
}

// ===== DELETE EXPENSE =====
function deleteExpense(id) {
  if (!confirm('この立替を削除しますか？')) return;
  state.expenses = state.expenses.filter(function(e) { return e.id !== id; });
  saveState();
  renderRecentExpenses();
  renderHistory();
  showToast('削除しました');
}

// ===== EDIT EXPENSE (Bug fix #1: targets editable in modal) =====
function openEdit(id) {
  var e = state.expenses.find(function(x) { return x.id === id; });
  if (!e) return;
  document.getElementById('edit-id').value = id;
  document.getElementById('edit-name').value = e.name;
  document.getElementById('edit-amount').value = e.amount;
  document.getElementById('edit-cat').value = e.cat;
  document.getElementById('edit-memo').value = e.memo || '';

  // Render target checkboxes with current selection
  var editTargets = document.getElementById('edit-targets');
  editTargets.innerHTML = state.participants.map(function(p) {
    var isChecked = e.targets.includes(p);
    return '<label class="check-item' + (isChecked ? ' checked' : '') + '" id="edit-chk-wrap-' + esc(p) + '">' +
      '<input type="checkbox"' + (isChecked ? ' checked' : '') + ' onchange="toggleEditCheck(this)">' +
      '<span>' + esc(p) + '</span></label>';
  }).join('');

  openModal('edit-modal');
}

function toggleEditCheck(cb) {
  cb.closest('.check-item').classList.toggle('checked', cb.checked);
}

function saveEdit() {
  var id = document.getElementById('edit-id').value;
  var idx = state.expenses.findIndex(function(x) { return x.id === id; });
  if (idx < 0) return;
  var name = document.getElementById('edit-name').value.trim();
  var amount = parseFloat(document.getElementById('edit-amount').value);
  if (!name || !amount || amount <= 0) { alert('内容と金額を入力してください'); return; }

  // Bug fix #1: get targets from edit modal checkboxes explicitly
  var targets = Array.from(document.querySelectorAll('#edit-targets .check-item.checked span'))
    .map(function(s) { return s.textContent; });
  if (targets.length === 0) { alert('対象者を1人以上選択してください'); return; }

  // Update only the edited fields, explicitly set targets
  state.expenses[idx].name = name;
  state.expenses[idx].amount = amount;
  state.expenses[idx].cat = document.getElementById('edit-cat').value;
  state.expenses[idx].memo = document.getElementById('edit-memo').value.trim();
  state.expenses[idx].targets = targets; // explicit, not from spread

  saveState();
  renderRecentExpenses();
  renderHistory();
  renderSettlement();
  closeModal('edit-modal');
  showToast('✔ 更新しました');
}

// ===== SETTLEMENT CALCULATION (Bug fix #2: float accumulation, round only at fmt) =====
function calcPerParticipant() {
  var map = {};
  state.participants.forEach(function(p) {
    map[p] = { base: 0, fee: 0, withFee: 0, breakdown: [] };
  });

  state.expenses.forEach(function(e) {
    if (!e.targets || e.targets.length === 0) return;
    var perPerson = e.amount / e.targets.length; // float, no round here
    e.targets.forEach(function(t) {
      if (map[t] !== undefined) {
        map[t].base += perPerson; // accumulate floats
        map[t].breakdown.push({ name: e.name, amount: perPerson }); // float
      }
    });
  });

  // Calculate fee and total - still floats, round only at display
  Object.keys(map).forEach(function(p) {
    map[p].fee = map[p].base * 0.05;
    map[p].withFee = map[p].base * 1.05;
  });

  return map;
}

function renderSettlement() {
  if (!state.participants.length || !state.expenses.length) {
    document.getElementById('settlement-summary-box').innerHTML = '';
    document.getElementById('settlement-cards').innerHTML =
      '<div class="empty-state">メンバーと立替を追加すると精算が表示されます</div>';
    return;
  }

  var perMap = calcPerParticipant();
  var totalBase = 0, totalFee = 0, totalWithFee = 0;
  Object.values(perMap).forEach(function(d) {
    totalBase += d.base;
    totalFee += d.fee;
    totalWithFee += d.withFee;
  });

  // Summary box
  document.getElementById('settlement-summary-box').innerHTML =
    '<div class="summary-box">' +
      '<div class="summary-row"><span>立替合計</span><span>' + fmt(totalBase) + '</span></div>' +
      '<div class="summary-row"><span>手数料合計（5%）</span><span>' + fmt(totalFee) + '</span></div>' +
      '<div class="summary-row total"><span>案内人受取総額</span><span>' + fmt(totalWithFee) + '</span></div>' +
    '</div>';

  // Per-participant cards
  document.getElementById('settlement-cards').innerHTML =
    state.participants.map(function(p) {
      var d = perMap[p];
      var breakdownHTML = d.breakdown.map(function(b, i) {
        return '<div class="settlement-line breakdown-item">' +
          '<span>立替' + (i+1) + '. ' + esc(b.name) + '</span>' +
          '<span class="amt">' + fmt(b.amount) + '</span></div>';
      }).join('');

      return '<div class="settlement-card">' +
        '<div class="settlement-card-header">' +
          '<div class="settlement-card-name">' +
            '<div class="settlement-avatar">' + esc(p[0]) + '</div>' +
            esc(p) +
          '</div>' +
          '<div class="settlement-card-total">' + fmt(d.withFee) + '</div>' +
        '</div>' +
        '<div class="settlement-card-body">' +
          '<div class="settlement-line"><span>費用負担分</span><span class="amt">' + fmt(d.base) + '</span></div>' +
          breakdownHTML +
          '<div class="settlement-line fee"><span>決済・管理手数料（5%）</span><span class="amt">' + fmt(d.fee) + '</span></div>' +
          '<div class="settlement-line total"><span>→ 案内人への支払合計</span><span class="amt">' + fmt(d.withFee) + '</span></div>' +
        '</div>' +
      '</div>';
    }).join('');
}

// ===== HISTORY =====
function renderHistory() {
  var el = document.getElementById('history-list');
  if (state.expenses.length === 0) {
    el.innerHTML = '<div class="empty-state">立替がありません</div>';
    return;
  }
  el.innerHTML = state.expenses.slice().reverse().map(function(e) {
    var perPerson = e.amount / e.targets.length;
    return '<div class="card" style="padding:12px 16px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;">' +
        '<div>' +
          '<div style="font-weight:700;font-size:0.9rem;">' + esc(e.name) + '</div>' +
          '<div style="font-size:0.72rem;color:var(--text-soft);margin-top:2px;">' +
            e.date + ' · ' + e.cat +
            (e.memo ? ' · ' + esc(e.memo) : '') +
          '</div>' +
          '<div style="font-size:0.75rem;color:var(--text-soft);margin-top:2px;">' +
            esc(e.targets.join('・')) +
          '</div>' +
        '</div>' +
        '<div style="text-align:right;">' +
          '<div style="font-size:1rem;font-weight:700;color:var(--sage);">' + fmt(e.amount) + '</div>' +
          '<div style="font-size:0.72rem;color:var(--text-soft);">1人 ' + fmt(perPerson) + '</div>' +
        '</div>' +
      '</div>' +
      (!isViewMode ? '<div style="display:flex;gap:6px;margin-top:8px;justify-content:flex-end;">' +
        '<button class="btn btn-secondary btn-sm" onclick="openEdit(\'' + e.id + '\')">✏️ 編集</button>' +
        '<button class="btn btn-sm" style="background:var(--bg);color:var(--danger);border:1.5px solid var(--danger);" onclick="deleteExpense(\'' + e.id + '\')">🗑️ 削除</button>' +
      '</div>' : '') +
    '</div>';
  }).join('');
}

// ===== SHARE URL =====
function generateShareURL() {
  if (!state.participants.length || !state.expenses.length) {
    alert('メンバーと立替を追加してからURLを発行してください');
    return;
  }
  var ts = new Date();
  var payload = {
    t: state.tourName,
    g: state.guide,
    c: state.currency,
    p: state.participants,
    e: state.expenses,
    ts: ts.getTime()
  };
  var encoded = btoa(encodeURIComponent(JSON.stringify(payload)));
  shareURL = location.href.split('#')[0] + '#view=' + encoded;
  document.getElementById('share-url-box').textContent = shareURL;
  document.getElementById('share-url-area').style.display = 'block';
}

function copyShareURL() {
  if (!shareURL) return;
  navigator.clipboard.writeText(shareURL).then(function() {
    showToast('📋 URLをコピーしました');
  }).catch(function() {
    alert('コピーに失敗しました。手動でURLをコピーしてください。');
  });
}

// ===== VIEW MODE =====
function checkViewMode() {
  var hash = location.hash;
  if (!hash.startsWith('#view=')) return false;
  try {
    var encoded = hash.slice(6);
    var payload = JSON.parse(decodeURIComponent(atob(encoded)));
    isViewMode = true;

    // Apply view state
    state.tourName = payload.t;
    state.guide = payload.g;
    state.currency = payload.c || '¥';
    state.participants = payload.p;
    state.expenses = payload.e;

    // Launch app
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('header-title').textContent = state.tourName;
    document.getElementById('header-sub').textContent = '案内人：' + state.guide;

    // Bug fix #3: safe logo copy with existence check
    var mainLogo = document.getElementById('header-logo');
    if (mainLogo) {
      mainLogo.src = '';
    }

    // Show view banner with timestamp
    var banner = document.getElementById('view-banner');
    banner.style.display = 'block';
    if (payload.ts) {
      var d = new Date(payload.ts);
      var y = d.getFullYear(), mo = d.getMonth()+1, day = d.getDate();
      var h = String(d.getHours()).padStart(2,'0'), min = String(d.getMinutes()).padStart(2,'0');
      document.getElementById('view-timestamp').textContent =
        y + '年' + mo + '月' + day + '日 ' + h + ':' + min + '時　更新　精算記録';
    }

    // Hide edit controls
    document.getElementById('add-member-section').style.display = 'none';
    var formCard = document.getElementById('expense-form-card');
    if (formCard) formCard.style.display = 'none';
    var shareCard = document.getElementById('share-card');
    if (shareCard) shareCard.style.display = 'none';
    var newTourBtn = document.querySelector('.header-btn');
    if (newTourBtn) newTourBtn.style.display = 'none';
    var saveInd = document.getElementById('save-indicator');
    if (saveInd) saveInd.style.display = 'none';

    renderMemberCards();
    renderRecentExpenses();
    renderSettlement();
    renderHistory();

    // Switch to settlement tab by default in view mode
    switchTab('settlement');
    return true;
  } catch(e) {
    console.error('View mode error:', e);
    return false;
  }
}

// ===== CSV EXPORT =====
function downloadCSV(filename, rows) {
  var BOM = '\uFEFF';
  var csv = BOM + rows.map(function(r) {
    return r.map(function(cell) {
      return '"' + String(cell).replace(/"/g, '""') + '"';
    }).join(',');
  }).join('\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function exportHistoryCSV() {
  if (!state.expenses.length) { alert('立替データがありません'); return; }
  var rows = [
    ['ツアー名', state.tourName],
    ['案内人', state.guide],
    ['出力日時', new Date().toLocaleString('ja-JP')],
    [],
    ['日付', '内容', 'カテゴリ', '金額(' + state.currency + ')', '対象者数', '1人あたり', '対象者', 'メモ']
  ];
  state.expenses.forEach(function(e) {
    rows.push([e.date, e.name, e.cat, e.amount,
      e.targets.length, Math.round(e.amount / e.targets.length),
      e.targets.join('・'), e.memo || '']);
  });
  var total = state.expenses.reduce(function(s, e) { return s + e.amount; }, 0);
  rows.push([], ['合計', '', '', total, '', '', '', '']);
  downloadCSV('立替履歴_' + state.tourName + '.csv', rows);
}

function exportSettlementCSV() {
  if (!state.expenses.length) { alert('立替データがありません'); return; }
  var perMap = calcPerParticipant();
  var totalBase = 0, totalFee = 0, totalWithFee = 0;
  Object.values(perMap).forEach(function(d) {
    totalBase += d.base; totalFee += d.fee; totalWithFee += d.withFee;
  });
  var rows = [
    ['ツアー立替精算'],
    ['ツアー名', state.tourName],
    ['案内人', state.guide],
    ['出力日時', new Date().toLocaleString('ja-JP')],
    [],
    ['参加者名', '費用負担分(' + state.currency + ')', '手数料5%(' + state.currency + ')', '支払合計(' + state.currency + ')']
  ];
  state.participants.forEach(function(p) {
    var d = perMap[p];
    rows.push([p, Math.round(d.base), Math.round(d.fee), Math.round(d.withFee)]);
  });
  rows.push([], ['合計', Math.round(totalBase), Math.round(totalFee), Math.round(totalWithFee)]);
  downloadCSV('精算結果_' + state.tourName + '.csv', rows);
}

// ===== MODAL =====
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(function(el) {
  el.addEventListener('click', function(e) {
    if (e.target === el) el.classList.remove('open');
  });
});

// ===== TOAST =====
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2200);
}

// ===== ESCAPE =====
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ===== INIT =====
if (!checkViewMode()) {
  if (loadState() && state.tourName && state.guide) {
    launchApp();
  }
}
</script>
